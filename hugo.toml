# ============================================
# Hugo 站点配置
# ============================================

# 站点基础信息
baseURL = 'https://freetomyself.github.io/my-blog/'
locale = 'zh-cn'
title = '运维笔记'
hasCJKLanguage = true  # 启用中文分词（影响搜索和摘要）
theme = 'PaperMod'

# 构建选项
buildDrafts = false    # 不构建草稿
buildFuture = false    # 不构建未来日期的文章

# 首页输出格式：HTML + RSS + JSON（JSON 用于搜索索引）
[outputs]
  home = ['html', 'rss', 'json']

# RSS 输出配置
[outputs.rss]
  limit = 20  # RSS 最多包含 20 篇文章

# ============================================
# 站点参数
# ============================================
[params]
  env = 'production'
  description = '运维工程师的技术笔记与生活随笔'
  author = 'freetomyself'

  # 主题模式：auto 跟随系统，light 亮色，dark 暗色
  defaultTheme = 'auto'

  # 阅读体验
  ShowReadingTime = true        # 显示阅读时间
  ShowTotalReadingTime = true   # 显示总阅读时间
  ShowShareButtons = false      # 隐藏分享按钮
  ShowPostNavLinks = true       # 显示上一篇/下一篇
  ShowBreadCrumbs = true        # 显示面包屑导航
  ShowCodeCopyButtons = true    # 代码块显示复制按钮
  ShowToc = true                # 显示文章目录
  TocOpen = false               # 目录默认折叠

  # 首页配置
  ShowRssButtonInSectionTerm = false
  ShowWordCount = false

  # 评论系统开关
  comments = true

  # Giscus 评论配置（基于 GitHub Discussions）
  [params.giscus]
    repo = "freetomyself/my-blog"
    repoId = "R_kgDOUYySjA"
    category = "Announcements"
    categoryId = "DIC_kwDOUYySjM4DFfvl"

# 首页欢迎语
[params.homeInfoParams]
  Title = '你好 👋'
  Content = '''
欢迎来到我的博客。这里记录运维实践、技术笔记和生活随笔。
'''

# 社交链接
[[params.socialIcons]]
  name = "github"
  url = "https://github.com/freetomyself"

# ============================================
# 导航菜单
# ============================================
[menus]
  [[menus.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menus.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 20
  [[menus.main]]
    identifier = "series"
    name = "系列"
    url = "/series/"
    weight = 25
  [[menus.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 30
  [[menus.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 40
  [[menus.main]]
    identifier = "writing"
    name = "写作指南"
    url = "/writing/"
    weight = 45
  [[menus.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 50

# ============================================
# 分类法（标签、分类、系列）
# ============================================
[taxonomies]
  tag = 'tags'
  category = 'categories'
  series = 'series'

# ============================================
# Markdown 渲染配置
# ============================================
[markup]
  # 允许 HTML 标签
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  # 代码高亮
  [markup.highlight]
    codeFences = true      # 启用代码围栏
    guessSyntax = true     # 自动识别语法
    lineNos = false        # 不显示行号
    style = 'monokai'      # 高亮主题
    tabWidth = 2           # Tab 宽度

  # 文章目录层级
  [markup.tableOfContents]
    startLevel = 2  # 从 h2 开始
    endLevel = 4    # 到 h4 结束

# ============================================
# 分页配置
# ============================================
[pagination]
  pagerSize = 10  # 每页显示 10 篇文章

# ============================================
# 图片压缩配置
# ============================================
[imaging]
  [imaging.jpeg]
    quality = 85
  [imaging.webp]
    quality = 85
  [imaging.avif]
    quality = 85
